name: workflow-use-matrix
on: push

# https://docs.github.com/ko/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
# matrix 는 하나의 job 정의를 여러 조합으로 자동 확장해서 실행할 때 사용한다.
#     여러 OS, 여러 language version, 여러 runtime 조합을 테스트할 때 유용하다.
#
# strategy.matrix 에 변수와 값 목록을 정의하면 GitHub Actions 가 가능한 모든 조합의 job 을 자동으로 만든다.
#     아래 예시는 os 2개와 version 2개를 조합하므로 총 4개의 job 이 실행된다.
#         windows-latest + 12
#         windows-latest + 14
#         ubuntu-latest + 12
#         ubuntu-latest + 14
#
# matrix 를 사용하면 workflow-1-without-matrix.yml 처럼 같은 구조의 job 을 여러 번 복사하지 않아도 된다.
#     조합을 추가하고 싶다면 matrix 의 배열 값만 추가하면 된다.
#     예를 들어 version 에 16 을 추가하면 os 2개 * version 3개 = 총 6개의 job 이 실행된다.

jobs:
  get-matrix:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest] # matrix.os 값 목록이다. 각 값은 runs-on 에 전달되어 서로 다른 runner 에서 job 을 실행한다.
        version: [12, 14] # matrix.version 값 목록이다. os 값과 조합되어 총 4개의 job 을 만든다.
    runs-on: ${{ matrix.os }} # 현재 matrix 조합의 os 값을 runner 로 사용한다.
    steps:
      - name: check matrix
        run: |
          echo "os: ${{ matrix.os }}"
          echo "version: ${{ matrix.version }}"
