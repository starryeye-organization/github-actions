name: workflow-use-output
on: push

# https://docs.github.com/ko/actions/reference/workflows-and-actions/workflow-syntax
#     jobs.<job_id>.outputs, jobs.<job_id>.needs 항목 참고
# https://docs.github.com/ko/actions/reference/workflows-and-actions/workflow-commands
#     GITHUB_OUTPUT 항목 참고
# output 은 workflow 안에서 생성한 값을 다른 step 이나 다른 job 에 전달할 때 사용한다.
#     예를 들어 build job 에서 생성한 image tag, version, file path 등을 deploy job 에 전달할 수 있다.
#
# step output
#     step 에 id 를 지정해야 다른 step 에서 해당 step 의 output 을 참조할 수 있다.
#     echo "이름=값" >> $GITHUB_OUTPUT 형식으로 작성하면 step output 이 생성된다.
#     같은 job 안에서는 steps.<step_id>.outputs.<output_name> 형식으로 사용할 수 있다.
#
# job output
#     다른 job 에서 step output 을 직접 참조할 수는 없다.
#     다른 job 에 값을 전달하려면 jobs.<job_id>.outputs 에 step output 을 매핑해야 한다.
#     이후 needs.<job_id>.outputs.<output_name> 형식으로 사용할 수 있다.
#
# artifact 와 output 의 차이
#     artifact 는 파일을 업로드하고 다운로드해서 job 사이에 공유할 때 사용한다.
#     output 은 짧은 문자열 값이나 식별자 같은 데이터를 job 사이에 전달할 때 사용한다.
#
# 위 예시는 아래 흐름으로 동작한다.
#     create-output job 의 check-output step 에서 test=hello 라는 step output 생성
#     create-output job 의 outputs.test 에 step output 을 job output 으로 매핑
#     get-output job 에서 needs.create-output.outputs.test 로 job output 사용

jobs:
  create-output:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.check-output.outputs.test }} # step output 을 job output 으로 매핑한다. (키(output_name)는 test, 값은 steps.check-output.outputs.test)
    steps:
      - name: echo output
        id: check-output # 이 id 를 기준으로 steps.check-output.outputs.test 형식의 output 참조가 가능해진다.
        run: |
          echo "test=hello" >> $GITHUB_OUTPUT # test 라는 이름의 step output 에 hello 값을 저장한다.

      - name: check output
        run: |
          echo ${{ steps.check-output.outputs.test }} # 같은 job 안에서 step output 을 참조한다.

  get-output:
    needs: [create-output] # create-output job 이 끝난 뒤 실행되며, needs context 로 create-output 의 job output 에 접근할 수 있다.
    runs-on: ubuntu-latest
    steps:
      - name: get output
        run: echo ${{ needs.create-output.outputs.test }} # 다른 job 에서는 needs.<job_id>.outputs.<output_name> 형식으로 참조한다.
