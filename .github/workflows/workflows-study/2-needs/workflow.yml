name: workflow-1
on: push

# 기본적으로 하나의 workflow 내에서 job 들은 서로 병렬로 실행된다.
# 하지만, job B 가 반드시 job A 이후에 실행되어야하는 종속성이 필요할 수 있다. 이때 needs 를 사용한다.
# needs
#   어떤 job 이 다른 job 또는 여러 job 이 완료될 때 실행될 필요가 있을 때 사용
#   즉, job 들간에 실행 순서를 부여하고 싶을 때 사용한다.

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: echo "job1 is done"
  job2:
    runs-on: ubuntu-latest
    needs: [job1] # job1 이 실행 성공된 이후에 실행되도록 한다.
    steps:
      - name: step1
        run: echo "job2 is done"
  job3:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: |
          echo "job3 is failed"
          exit 1

  job4:
    runs-on: ubuntu-latest
    needs: [ job3 ] # job3 이 실행 성공된 이후에 실행되도록 한다. (job3 은 실패이므로 실행되지 않음)
    steps:
      - name: step1
        run: echo "job4 is done"

# job1, job3 은 종속성이 없는 job 이므로 workflow 시작과 동시에 병렬로 실행
# job2, job4 는 각각 job1, job3 이 실행 성공하면 실행될 것이다.
#     하지만, job3 은 실패하므로 job4 는 실행되지 않을 것이다.