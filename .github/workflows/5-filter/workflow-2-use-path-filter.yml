name: workflow-use-path-filter
on:
  push:
    paths: # 해당 path filter 는 push 이벤트가 트리거 되면 my-app/**, Dockerfile 변경에 한하여 동작하고, my-app/**/*.test.js 는 제외한다.
      - 'my-app/**'
      - '!my-app/**/*.test.js'
      - 'Dockerfile'
  pull_request:
    paths: # 해당 path filter 는 pull_request 이벤트가 트리거 되면 변경 파일이 my-app/**, Dockerfile 인 경우에 한하여 동작하고, my-app/**/*.test.js 는 제외한다.
      - 'my-app/**'
      - '!my-app/**/*.test.js'
      - 'Dockerfile'
  workflow_dispatch:

# https://docs.github.com/ko/actions/reference/workflows-and-actions/workflow-syntax
#     on.push.paths, on.pull_request.paths, paths-ignore 항목 참고
# path filter 는 workflow 를 실행할 file path 또는 실행하지 않을 file path 를 지정할 때 사용한다.
#     특정 파일이나 디렉터리가 변경되었을 때만 CI/CD 를 실행하고 싶을 때 사용할 수 있다.
#
# 위 예시는 아래 상황에서 workflow 가 실행된다.
#     my-app/ 하위 파일이 변경된 push 이벤트 발생
#     Dockerfile 이 변경된 push 이벤트 발생
#     my-app/ 하위 파일이 변경된 pull request 이벤트 발생
#     Dockerfile 이 변경된 pull request 이벤트 발생
#     단, my-app/**/*.test.js 만 변경된 경우에는 실행되지 않는다.
#
# push 와 pull_request 의 paths 는 이벤트에 포함된 변경 파일을 기준으로 판단한다.
#     예를 들어 README.md 만 수정해서 push 하면 이 workflow 는 실행되지 않는다.
#
# paths-ignore 를 사용하면 특정 file path 를 제외할 수 있다.
#     단, 같은 이벤트에서 paths 와 paths-ignore 를 동시에 사용할 수 없다.
#     포함과 제외를 함께 사용하고 싶다면 paths 에 ! 패턴을 사용할 수 있다.
#     ! 패턴은 제외할 패턴을 의미하며, 포함 패턴 뒤에 작성해야 제외 조건으로 동작한다.
#
# branch filter 와 path filter 를 같은 이벤트에 함께 사용하면 두 조건을 모두 만족할 때 workflow 가 실행된다.
#     예를 들어 branches 가 dev 이고 paths 가 my-app/** 이면 dev branch 에 my-app/ 변경이 있을 때만 실행된다.
#
# workflow_dispatch 는 path filter 를 거치지 않고 수동 실행할 수 있도록 추가한 이벤트이다.

jobs:
  my-job-1:
    runs-on: ubuntu-latest
    steps:
      - name: print path filter information
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "ref_name: ${{ github.ref_name }}"
