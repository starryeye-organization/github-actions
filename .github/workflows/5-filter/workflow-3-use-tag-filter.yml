name: workflow-use-tag-filter
on:
  push:
    tags: # 해당 tag filter 는 push 이벤트가 트리거 되면 semantic version 형태의 tag 에 한하여 동작한다.
      - 'v[0-9]+.[0-9]+.[0-9]+' # v1.0.0 은 트리거되고 v1.0 은 트리거되지 않는다. v* 로 작성하면 v 로 시작하는 tag 가 모두 대상이 된다.
  workflow_dispatch:

# https://docs.github.com/ko/actions/reference/workflows-and-actions/workflow-syntax
#     on.push.tags, on.push.tags-ignore 항목 참고
# tag filter 는 workflow 를 실행할 tag 또는 실행하지 않을 tag 를 지정할 때 사용한다.
#     특정 release tag 가 생성되었을 때만 CI/CD 를 실행하고 싶을 때 사용할 수 있다.
#
# 위 예시는 아래 상황에서 workflow 가 실행된다.
#     v1.0.0 tag 에 push 이벤트 발생
#     v2.1.3 tag 에 push 이벤트 발생
#     v2026.06.28 tag 에 push 이벤트 발생
#     단, v1.0 처럼 major, minor, patch 를 모두 포함하지 않는 tag 에서는 실행되지 않는다.
#
# v* 로 작성하면 v 로 시작하는 모든 tag 에서 workflow 가 실행될 수 있다.
#     예를 들어 v1.0, v1.0.0-alpha, v-test 같은 tag 도 대상이 된다.
#     따라서 release tag 형태를 더 좁게 제한하고 싶다면 v[0-9]+.[0-9]+.[0-9]+ 같은 패턴을 사용할 수 있다.
#
# push 의 tags 는 push 된 Git ref 가 tag 인 경우에만 판단한다.
#     위 예시처럼 tags 만 정의하면 branch push 에 대해서는 이 workflow 가 실행되지 않는다.
#
# tags-ignore 를 사용하면 특정 tag 를 제외할 수 있다.
#     단, 같은 이벤트에서 tags 와 tags-ignore 를 동시에 사용할 수 없다.
#     포함과 제외를 함께 사용하고 싶다면 tags 에 ! 패턴을 사용할 수 있다.
#     ! 패턴은 제외할 패턴을 의미하며, 포함 패턴 뒤에 작성해야 제외 조건으로 동작한다.
#
# path filter 는 tag push 에 대해 평가되지 않는다.
#     tag 를 push 할 때는 어떤 파일이 변경되었는지가 아니라 tag ref 를 기준으로 workflow 실행 여부가 결정된다.
#
# pull_request 이벤트는 tag 가 아니라 대상 branch 를 기준으로 생성되므로 tag filter 를 사용하지 않는다.
#
# workflow_dispatch 는 tag filter 를 거치지 않고 수동 실행할 수 있도록 추가한 이벤트이다.

jobs:
  my-job-1:
    runs-on: ubuntu-latest
    steps:
      - name: print tag information
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "ref_name: ${{ github.ref_name }}"
