name: workflow-use-secrets
on: push

# https://docs.github.com/ko/actions/security-guides/using-secrets-in-github-actions
# https://docs.github.com/ko/actions/reference/workflows-and-actions/contexts#secrets-context
# secrets context 는 GitHub repository, organization, environment level 에 미리 등록해둔 secret 값을 참조할 때 사용한다.
#     비밀번호, token, API key 처럼 workflow 파일에 직접 적으면 안 되는 민감한 값을 저장할 때 사용한다.
#
# repository secret 생성 위치
#     Repository > Settings > Secrets and variables > Actions > Secrets > New repository secret
#     위 화면에서 Name 을 level 로 만들고 Secret 값을 저장하면 아래 workflow 에서 ${{ secrets.level }} 로 참조할 수 있다.
#
# vars 와 secrets 의 차이
#     vars 는 민감하지 않은 설정값을 저장할 때 사용한다.
#     secrets 는 민감한 값을 암호화해서 저장하고 workflow 에서 필요할 때만 참조할 때 사용한다.
#     secrets 값은 GitHub Actions 로그에 출력되면 보통 *** 로 마스킹된다.
#
# secrets context 로 값을 참조하는 방법
#     ${{ secrets.level }} 형식으로 secret 값을 가져온다.
#     설정된 secret 이 없으면 빈 문자열로 평가된다.
#
# 주의
#     실제 workflow 에서는 secret 값을 echo 로 출력하지 않는 것이 좋다.
#     아래 예시는 secrets context 참조 방법을 확인하기 위한 학습용 예제이다.

jobs:
  get-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: get secrets
        run: echo "LEVEL ${{ secrets.level }}" # repository secret level 값을 secrets context 로 참조한다. 로그에서는 마스킹될 수 있다.
