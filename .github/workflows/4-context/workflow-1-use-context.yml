name: workflow-use-context
on:
  push:
  workflow_dispatch:

# https://docs.github.com/ko/actions/reference/workflows-and-actions/contexts
# context 는 workflow 실행과 관련된 여러 정보들을 담고 있는 객체이다.
#     예를 들어 github context 에는 workflow 를 실행시킨 이벤트, 브랜치, 커밋, repository, actor 등의 정보가 들어있다.
#     github, runner, job, steps, env, inputs, secrets 등 여러 종류의 context 가 존재한다.
#
# context 를 사용하는 이유
#     workflow 가 실행되는 상황에 따라 step 이나 job 의 동작을 다르게 만들고 싶을 때 사용한다.
#     예를 들어 github context 를 사용하면,
#         dev branch 에 push 이벤트가 발생하면 workflow 에서 1번 job 실행
#         master branch 에 push 이벤트가 발생하면 workflow 에서 2번 job 실행
#     같은 조건을 설정할 수 있다.
#
# context 는 ${{ github.actor }} 처럼 expression 문법 안에서 접근한다.
# object 타입은 ${{ toJSON(github) }} 처럼 toJSON 을 이용하면 JSON 형식으로 만들고 출력할 수 있다.

jobs:
  my-job-1:
    if: ${{ github.ref == 'refs/heads/dev' }} # dev branch 에 push 되거나 dev branch 를 대상으로 수동 실행되면 실행
    runs-on: ubuntu-latest
    steps:
      - name: print github context values
        run: |
          echo "actor: ${{ github.actor }}"
          echo "event_name: ${{ github.event_name }}"
          echo "repository: ${{ github.repository }}"
          echo "ref: ${{ github.ref }}"

      - name: print github context as JSON
        run: |
          echo '${{ toJSON(github) }}'

  my-job-2:
    if: ${{ github.ref == 'refs/heads/master' }} # master branch 에 push 되거나 master branch 를 대상으로 수동 실행되면 실행
    runs-on: ubuntu-latest
    steps:
      - name: print github ref
        run: |
          echo "ref: ${{ github.ref }}"
