name: workflow-use-vars-and-secrets-level
on: push

# https://docs.github.com/ko/actions/learn-github-actions/variables
# https://docs.github.com/ko/actions/reference/workflows-and-actions/variables
# https://docs.github.com/ko/actions/security-guides/using-secrets-in-github-actions
# https://docs.github.com/ko/actions/reference/security/secrets
# variables 와 secrets 는 organization, repository, environment level 에 각각 저장할 수 있다.
#     vars 는 민감하지 않은 설정값을 저장할 때 사용한다.
#     secrets 는 비밀번호, token, API key 처럼 민감한 값을 저장할 때 사용한다.
#
# variables 관리 위치
#     organization level: Organization > Settings > Secrets and variables > Actions > Variables
#     repository level: Repository > Settings > Secrets and variables > Actions > Variables
#     environment level: Repository > Settings > Environments > {environment name} > Environment variables
#
# secrets 관리 위치
#     organization level: Organization > Settings > Secrets and variables > Actions > Secrets
#     repository level: Repository > Settings > Secrets and variables > Actions > Secrets
#     environment level: Repository > Settings > Environments > {environment name} > Environment secrets
#
# organization level 의 variables/secrets 는 repository access policy 를 설정할 수 있다.
#     모든 repository 에 허용할 수도 있고, 특정 repository 에만 허용할 수도 있다.
#     허용되지 않은 repository 의 workflow 에서는 해당 organization level 값을 사용할 수 없다.
#
# 우선순위
#     environment > repository > organization 순서로 더 구체적인 level 의 값이 우선한다.
#
# environment level 값을 사용하려면 job 에 environment 를 지정해야 한다.
#     아래 get-repository-level job 은 environment 를 지정하지 않았으므로 organization/repository level 값을 확인한다.
#     아래 get-environment-level job 은 environment: dev 를 지정했으므로 dev environment level 값까지 확인한다.
#
# 예시로 Name 이 level 인 값을 각 level 에 모두 등록했다고 가정한다.
#     organization variable level = organization
#     repository variable level = repository
#     dev environment variable level = environment
#     organization secret level = organization-secret
#     repository secret level = repository-secret
#     dev environment secret level = environment-secret
#
# 이 경우 get-repository-level job 에서는 repository level 값이 우선된다.
#     vars.level 은 repository 가 된다.
#     secrets.level 은 repository-secret 이 된다. 단, 로그에서는 보통 *** 로 마스킹된다.
#
# 이 경우 get-environment-level job 에서는 environment level 값이 우선된다.
#     vars.level 은 environment 가 된다.
#     secrets.level 은 environment-secret 이 된다. 단, 로그에서는 보통 *** 로 마스킹된다.
#
# 참고
#     environment level variables 는 job 실행이 시작된 뒤 runner 에서 사용할 수 있다.
#     organization/repository secrets 는 workflow run 이 queue 될 때 읽힌다.
#     environment secrets 는 environment 를 참조하는 job 이 시작될 때 읽힌다.
#


jobs:
  get-repository-level:
    runs-on: ubuntu-latest
    steps:
      - name: check vars and secrets without environment
        run: |
          echo "vars.level: ${{ vars.level }}" # repository level 과 organization level 에 같은 이름이 있으면 repository level 값이 출력된다.
          echo "secrets.level: ${{ secrets.level }}" # repository level 과 organization level 에 같은 이름이 있으면 repository level 값이 사용되고 로그에서는 마스킹될 수 있다.

  get-environment-level:
    runs-on: ubuntu-latest
    environment: dev # dev environment 에 등록된 variables/secrets 를 사용하려면 job 에 environment 를 지정해야 한다.
    steps:
      - name: check vars and secrets with environment
        run: |
          echo "vars.level: ${{ vars.level }}" # environment level, repository level, organization level 에 같은 이름이 있으면 environment level 값이 출력된다.
          echo "secrets.level: ${{ secrets.level }}" # environment level, repository level, organization level 에 같은 이름이 있으면 environment level 값이 사용되고 로그에서는 마스킹될 수 있다.
