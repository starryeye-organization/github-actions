name: workflow-use-expression-string-function
on: push

# https://docs.github.com/ko/actions/learn-github-actions/expressions
#     contains, startsWith, endsWith 항목 참고
# string function 은 문자열 값을 비교해서 true/false 를 반환하는 expression 함수이다.
#     if condition 과 함께 사용하면 branch 이름, tag 이름, event 값, label 이름 등이 특정 문자열을 포함하는지 확인할 수 있다.
#     예를 들어 release/ 로 시작하는 branch 에서만 배포 step 을 실행하거나, tag 가 특정 suffix 로 끝나는지 검사할 수 있다.
#
# startsWith(searchString, searchValue)
#     searchString 이 searchValue 로 시작하면 true 를 반환한다.
#
# endsWith(searchString, searchValue)
#     searchString 이 searchValue 로 끝나면 true 를 반환한다.
#
# contains(search, item)
#     search 가 문자열이면 item 이 부분 문자열로 포함될 때 true 를 반환한다.
#     search 가 배열이면 item 이 배열 요소로 포함될 때 true 를 반환한다.
#
# 주의할 점
#     GitHub Actions 의 string function 은 대소문자를 구분하지 않는다.
#     값은 문자열로 캐스팅되어 비교된다.
#     if 조건이 false 로 평가되면 해당 step 은 실행되지 않고 skipped 된다.

jobs:
  string-function:
    runs-on: ubuntu-latest
    steps:
      - name: startsWith true
        if: startsWith('github actions', 'git') # github actions 는 git 으로 시작하므로 true 이고 step 이 실행된다.
        run: echo "git"

      - name: startsWith false
        if: startsWith('github actions', 'test') # github actions 는 test 로 시작하지 않으므로 false 이고 step 이 skipped 된다.
        run: echo "test"

      - name: endsWith true
        if: endsWith('github actions', 'ions') # github actions 는 ions 로 끝나므로 true 이고 step 이 실행된다.
        run: echo "ions"

      - name: endsWith false
        if: endsWith('github actions', 'test') # github actions 는 test 로 끝나지 않으므로 false 이고 step 이 skipped 된다.
        run: echo "test"

      - name: contains act
        if: contains('github actions', 'act') # github actions 안에 act 가 포함되어 있으므로 true 이고 step 이 실행된다.
        run: echo "contains act"

      - name: contains git
        if: contains('github, actions', 'git') # github, actions 안에 git 이 포함되어 있으므로 true 이고 step 이 실행된다.
        run: echo "contains git"
