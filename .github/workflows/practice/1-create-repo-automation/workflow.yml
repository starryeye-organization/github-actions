name: practice-create-repo-automation
on:
  workflow_dispatch: # workflow 를 수동으로 실행할 때 사용한다.
    inputs: # 수동 실행 시 사용자에게 입력받을 값 목록이다.
      prefix:
        description: 'set repo prefix'
        required: true
        default: 'service'
        type: choice # 정해진 options 중 하나를 선택하게 하는 input type 이다.
        options:
          - example
          - service
      name:
        description: 'set repo name'
        required: true
        default: 'github-actions'
        type: string # 사용자가 직접 문자열을 입력하는 input type 이다.

# 이 실습 프로젝트는 workflow_dispatch 로 repository prefix/name 을 입력받고,
# GitHub CLI(gh)를 사용해서 starryeye-organization 하위에 public repository 를 자동 생성한다.
# repository 생성 성공/실패와 관계없이 Slack 으로 결과를 알리기 위해 if: always() 를 사용한다.
#
# 사전 준비
#     PERSONAL_ACCESS_TOKEN secret: gh auth login 에 사용할 GitHub token 이다.
#     SLACK_WEBHOOK_URL secret: slackapi/slack-github-action 에서 사용할 Incoming Webhook URL 이다.
#     GitHub token 에는 repository 를 생성할 수 있는 권한이 필요하다.

jobs:
  create-repo-automation:
    runs-on: ubuntu-latest # job 이 실행될 runner 환경이다.
    steps:
      - name: gh auth login
        run: |
          echo "${{ secrets.PERSONAL_ACCESS_TOKEN }}" | gh auth login --with-token # secret token 을 gh auth login 의 표준 입력으로 전달해서 GitHub CLI 인증을 수행한다.

      - name: create-repo
        id: create-repo # 이후 steps.create-repo.outcome 형식으로 이 step 의 실행 결과를 참조할 수 있다.
        run: |
          gh repo create starryeye-organization/${{ inputs.prefix }}-${{ inputs.name }} --public --add-readme # inputs context 로 수동 실행 시 입력한 값을 참조한다.

      - name: slack
        if: always() # 앞 step 의 성공/실패와 관계없이 Slack 알림 step 을 실행한다.
        uses: slackapi/slack-github-action@v1.24.0 # 외부 action 을 재사용한다.
        with:
          payload: |
            {
              "attachments": [
                {
                  "pretext": "create repo result",
                  "color": "28a745",
                  "fields": [
                    {
                      "title": "create repo result ${{ steps.create-repo.outcome }}",
                      "short": true,
                      "value": "${{ inputs.prefix }}-${{ inputs.name }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # Slack webhook URL 을 secrets context 로 참조한다.
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK # slack action 이 Incoming Webhook 방식으로 동작하도록 설정한다.
