apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: my-cluster
  region: ap-northeast-2
  version: "1.32"

iamIdentityMappings:
  - arn: arn:aws:iam::${ACCOUNT_ID}:role/github-actions-role
    groups:
      - system:masters
    username: github-actions
    noDuplicateARNs: true 
    
managedNodeGroups:
  - name: managed-ng
    instanceType: t3.medium
    minSize: 2
    maxSize: 2
    desiredCapacity: 2
    volumeSize: 100
